apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terraform-runner
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ptanshul/gitops-terraform-argocd.git
    targetRevision: master
    path: kubernetes/terraform-runner

  destination:
    server: https://kubernetes.default.svc
    namespace: terraform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
