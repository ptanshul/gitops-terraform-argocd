apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-runner
  namespace: terraform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    gitops/terraform-hash: "734d6c03168b870b"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: terraform-runner
      restartPolicy: Never
      containers:
      - name: terraform
        image: alpine:latest
        env:
        - name: ARM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: azure-credentials
              key: client_id
        - name: ARM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: azure-credentials
              key: client_secret
        - name: ARM_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: azure-credentials
              key: tenant_id
        - name: ARM_SUBSCRIPTION_ID
          valueFrom:
            secretKeyRef:
              name: azure-credentials
              key: subscription_id
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Starting Terraform Job ==="
          
          apk add --no-cache git curl unzip
          
          # Install Terraform
          TERRAFORM_VERSION=1.15.8
          curl -sSL -o terraform.zip https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          unzip -q terraform.zip -d /usr/local/bin
          rm terraform.zip
          
          terraform version
          
          echo "=== Cloning repository ==="
          git clone https://github.com/ptanshul/gitops-terraform-argocd.git /workspace
          cd /workspace
          git rev-parse HEAD
          
          cd /workspace/terraform
          
          echo "=== Terraform Init ==="
          terraform init
          
          echo "=== Terraform Validate ==="
          terraform validate
          
          echo "=== Terraform Plan ==="
          terraform plan -no-color
          
          echo "=== Terraform Apply ==="
          terraform apply -auto-approve -no-color
          
          echo "=== ? Apply PASSED ==="
