apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-runner
  namespace: terraform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    gitops/terraform-hash: "c0808cb6aa5d7566"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: terraform-runner
      restartPolicy: Never
      volumes:
      - name: azure-identity-token
        projected:
          sources:
          - serviceAccountToken:
              audience: api://AzureADTokenExchange
              expirationSeconds: 3600
              path: azure-identity-token
      containers:
      - name: terraform
        image: mcr.microsoft.com/azure-cli:latest
        volumeMounts:
        - name: azure-identity-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
        env:
        - name: ARM_USE_OIDC
          value: "true"
        - name: ARM_CLIENT_ID
          value: "c68d765d-5593-4d91-9802-11d7cdb8096c"
        - name: ARM_TENANT_ID
          value: "72f988bf-86f1-41af-91ab-2d7cd011db47"
        - name: ARM_SUBSCRIPTION_ID
          value: "76f62c75-865d-4b5e-99e9-f512832303ba"
        - name: ARM_OIDC_TOKEN_FILE_PATH
          value: "/var/run/secrets/azure/tokens/azure-identity-token"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Starting Terraform Job ==="
          
          # Install Terraform
          TERRAFORM_VERSION=1.15.8
          apt-get update -qq && apt-get install -y -qq wget unzip
          wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          unzip -q terraform_${TERRAFORM_VERSION}_linux_amd64.zip -d /usr/local/bin
          rm terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          
          terraform version
          
          echo "=== Cloning repository ==="
          git clone https://github.com/ptanshul/gitops-terraform-argocd.git /workspace
          cd /workspace
          git rev-parse HEAD
          
          cd /workspace/terraform
          
          echo "=== Checking OIDC token ==="
          ls -la /var/run/secrets/azure/tokens/ || echo "Token directory not found"
          test -f /var/run/secrets/azure/tokens/azure-identity-token && echo "OIDC token exists" || echo "OIDC token missing"
          
          # Login using OIDC token
          echo "=== Azure CLI Login with OIDC ==="
          az login --identity --username ${ARM_CLIENT_ID} --allow-no-subscriptions
          
          echo "=== Terraform Init ==="
          terraform init
          
          echo "=== Terraform Validate ==="
          terraform validate
          
          echo "=== Terraform Plan ==="
          terraform plan -no-color
          
          echo "=== Terraform Apply ==="
          terraform apply -auto-approve -no-color
          
          echo "=== ? Apply PASSED ==="
