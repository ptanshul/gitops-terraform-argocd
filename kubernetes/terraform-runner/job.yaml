apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-runner
  namespace: terraform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    gitops/terraform-hash: "1a6b06b7b74733a0"
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: terraform-runner
      restartPolicy: Never
      containers:
      - name: terraform
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Starting Terraform Job ==="
          
          apk add --no-cache git curl unzip
          
          # Install Terraform
          TERRAFORM_VERSION=1.15.8
          wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          unzip -q terraform_${TERRAFORM_VERSION}_linux_amd64.zip -d /usr/local/bin
          rm terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          
          terraform version
          
          echo "=== Cloning repository ==="
          git clone https://github.com/ptanshul/gitops-terraform-argocd.git /workspace
          cd /workspace
          git rev-parse HEAD
          
          cd /workspace/terraform
          echo "=== Terraform Init ==="
          terraform init
          
          echo "=== Terraform Validate ==="
          terraform validate
          
          echo "=== Terraform Plan ==="
          terraform plan -no-color
          
          echo "=== Terraform Apply ==="
          terraform apply -auto-approve -no-color
          
          echo "=== ? Apply PASSED ==="
