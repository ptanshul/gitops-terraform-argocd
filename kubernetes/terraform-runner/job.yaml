apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-runner
  namespace: terraform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    gitops/terraform-hash: "c818ab8e728fb822"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      annotations:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: terraform-runner
      restartPolicy: Never
      containers:
      - name: terraform
        image: alpine:latest
        env:
        - name: ARM_USE_OIDC
          value: "true"
        - name: ARM_CLIENT_ID
          valueFrom:
            fieldRef:
              fieldPath: "metadata.annotations['azure.workload.identity/client-id']"
        - name: ARM_TENANT_ID
          valueFrom:
            fieldRef:
              fieldPath: "metadata.annotations['azure.workload.identity/tenant-id']"
        - name: ARM_SUBSCRIPTION_ID
          value: "76f62c75-865d-4b5e-99e9-f512832303ba"
        - name: ARM_OIDC_TOKEN_FILE_PATH
          value: "/var/run/secrets/azure/tokens/azure-identity-token"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Starting Terraform Job ==="
          
          apk add --no-cache git curl unzip
          
          # Install Terraform
          TERRAFORM_VERSION=1.15.8
          wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          unzip -q terraform_${TERRAFORM_VERSION}_linux_amd64.zip -d /usr/local/bin
          rm terraform_${TERRAFORM_VERSION}_linux_amd64.zip
          
          terraform version
          
          echo "=== Cloning repository ==="
          git clone https://github.com/ptanshul/gitops-terraform-argocd.git /workspace
          cd /workspace
          git rev-parse HEAD
          
          cd /workspace/terraform
          
          echo "=== Checking OIDC token ==="
          ls -la /var/run/secrets/azure/tokens/ || echo "Token directory not found"
          test -f /var/run/secrets/azure/tokens/azure-identity-token && echo "OIDC token exists" || echo "OIDC token missing"
          
          echo "=== Terraform Init ==="
          terraform init
          
          echo "=== Terraform Validate ==="
          terraform validate
          
          echo "=== Terraform Plan ==="
          terraform plan -no-color
          
          echo "=== Terraform Apply ==="
          terraform apply -auto-approve -no-color
          
          echo "=== ? Apply PASSED ==="
